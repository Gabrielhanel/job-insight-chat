<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobInsight</title>
<style>
:root{--on:#fff;--warn:#b45309;--bg:#f6f7f9;--card:#fff;--txt:#1d2230;--mut:#677084;--bd:#e2e5ec;--acc:#2563eb;--bar:#dbe6fd}
@media(prefers-color-scheme:dark){:root{--on:#0b1220;--warn:#fbbf24;--bg:#14161c;--card:#1d2029;--txt:#e8eaf0;--mut:#9aa3b5;--bd:#2c303c;--acc:#6b9bff;--bar:#27304a}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--bd);background:var(--card);font-weight:600}
#chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;max-width:820px;width:100%;margin:0 auto}
.msg{max-width:100%;padding:12px 16px;border-radius:14px;overflow-wrap:anywhere}
.user{align-self:flex-end;background:var(--acc);color:var(--on);max-width:80%}
.bot{align-self:flex-start;background:var(--card);border:1px solid var(--bd);width:100%}
.err{border-color:#d33;color:#d33}
.bot h4{margin:16px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.lead{margin:0;font-weight:600}
.row{display:grid;grid-template-columns:130px 1fr 78px;align-items:center;gap:10px;margin:5px 0;font-size:14px}
.row .name{  white-space:normal; overflow-wrap:anywhere;}
.track{height:10px;background:var(--bar);border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--acc);border-radius:5px}
.pct{text-align:right;color:var(--mut);font-size:13px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:3px 10px;border:1px solid var(--bd);border-radius:999px;font-size:13px}
.meta{margin:12px 0 0;color:var(--mut);font-size:13px}
details{margin-top:12px;font-size:14px}
summary{cursor:pointer;color:var(--acc)}
details ul{margin:8px 0 0;padding-left:18px}
a{color:var(--acc)}
form{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--bd);background:var(--card)}
.bar{display:flex;gap:8px;max-width:780px;width:100%;margin:0 auto}
input,select,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--txt)}
input{flex:1;min-width:0}
button{background:var(--acc);color:var(--on);border:0;cursor:pointer;font-weight:600}
button:disabled{opacity:.5;cursor:wait}
.hint{max-width:780px;margin:0 auto;padding:0 20px 8px;color:var(--mut);font-size:12px;width:100%}
@media(max-width:560px){.row{grid-template-columns:90px 1fr 70px}}
.ex{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.ex button{background:transparent;color:var(--acc);border:1px solid var(--bd);font-weight:400;padding:4px 10px;border-radius:999px;font-size:13px}
.aviso{margin:10px 0 0;font-size:13px;color:var(--warn)}
.sec{background:transparent;color:var(--acc);border:1px solid var(--bd);margin-top:12px;padding:6px 12px;font-size:13px;font-weight:400}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<header>JobInsight</header>
<div id="chat" role="log" aria-live="polite"></div>
<form id="form"><div class="bar">
  <input id="q" aria-label="Cargo ou área" placeholder="Cargo ou área (ex.: desenvolvedor Kotlin jr)" autocomplete="off" autofocus>
  <select id="paginas" aria-label="Páginas de resultados" title="Páginas de resultados">
    <option value="1">1 página</option><option value="2">2 páginas</option>
    <option value="3" selected>3 páginas</option><option value="5">5 páginas</option>
  </select>
  <button id="btn">Buscar</button>
  <button type="button" id="cancel" class="sec" style="margin:0" hidden>Cancelar</button>
</div></form>
<div class="hint" id="hint" aria-live="polite">Cada página gasta 1 requisição da sua cota (no JSearch, ~10 vagas por página).</div>
<script>
const chat = document.getElementById('chat'), q = document.getElementById('q'),
      pages = document.getElementById('paginas'), btn = document.getElementById('btn');
const NIVEIS = {estagio:'Estágio', junior:'Júnior', pleno:'Pleno', senior:'Sênior', lead:'Lead', nao_informado:'Não informado'};

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function add(role) {
  const m = el('div', 'msg ' + role);
  chat.appendChild(m);
  chat.scrollTop = chat.scrollHeight;
  return m;
}
function bars(box, titulo, itens, n) {
  if (!itens || !itens.length) return;
  box.appendChild(el('h4', null, titulo));
  itens.slice(0, n).forEach(i => {
    const row = el('div', 'row'), track = el('div', 'track'), fill = el('div', 'fill');
    fill.style.width = i.percentual + '%';
    track.appendChild(fill);
    row.append(el('span', 'name', i.nome), track, el('span', 'pct', i.percentual + '% · ' + i.vagas));
    box.appendChild(row);
  });
}
function render(box, d) {
  box.appendChild(el('p', 'lead', `Analisei ${d.vagas_analisadas} vagas para “${d.cargo}”.`));
  bars(box, 'Tecnologias mais pedidas', d.tecnologias, 10);
  bars(box, 'Diferenciais', d.diferenciais, 5);
  if (d.soft_skills && d.soft_skills.length) {
    box.appendChild(el('h4', null, 'Soft skills'));
    const chips = el('div', 'chips');
    d.soft_skills.slice(0, 6).forEach(s => chips.appendChild(el('span', 'chip', `${s.nome} · ${s.percentual}%`)));
    box.appendChild(chips);
  }
  const niveis = Object.entries(d.niveis || {}).map(([k, v]) => `${NIVEIS[k] || k} ${v}`).join(' · ');
  let meta = niveis ? 'Níveis: ' + niveis : '';
  if (d.experiencia_mediana_anos != null) meta += (meta ? ' — ' : '') + `experiência mínima mediana: ${d.experiencia_mediana_anos} anos`;
  if (meta) box.appendChild(el('p', 'meta', meta));
  if (d.vagas && d.vagas.length) {
    const det = el('details'), ul = el('ul');
    det.appendChild(el('summary', null, `Ver vagas encontradas (${d.vagas.length})`));
    d.vagas.forEach(v => {
      const li = el('li'), txt = `${v.titulo}${v.empresa ? ' — ' + v.empresa : ''}`;
      if (/^https?:\/\//.test(v.link || '')) {
        const a = el('a', null, txt);
        a.href = v.link; a.target = '_blank'; a.rel = 'noopener';
        li.appendChild(a);
      } else li.textContent = txt;
      ul.appendChild(li);
    });
    det.appendChild(ul);
    box.appendChild(det);
  }
}

const form = document.getElementById('form'), cancel = document.getElementById('cancel'), hint = document.getElementById('hint');
const KEY = 'vagas-historico';
let hist = [];
try { hist = JSON.parse(localStorage.getItem(KEY)) || []; } catch {}
const salvar = () => { try { localStorage.setItem(KEY, JSON.stringify(hist.slice(-20))); } catch {} };

function markdown(d) {
  const l = [`**${d.vagas_analisadas} vagas para “${d.cargo}”**`, ''];
  (d.tecnologias || []).slice(0, 10).forEach(i => l.push(`- ${i.nome}: ${i.percentual}% (${i.vagas} vagas)`));
  return l.join('\n');
}
function extras(box, d) {
  (d.avisos || []).forEach(a => box.appendChild(el('p', 'aviso', a)));
  box.appendChild(el('p', 'meta', 'Extração: ' + (d.metodo === 'claude' ? 'Claude' : 'dicionário de palavras') + (d.do_cache ? ` · ${d.do_cache} página(s) vieram do cache` : '')));
  const c = el('button', 'sec', 'Copiar resumo');
  c.type = 'button';
  c.onclick = () => navigator.clipboard.writeText(markdown(d)).then(() => {
    c.textContent = 'Copiado!';
    setTimeout(() => c.textContent = 'Copiar resumo', 1500);
  });
  box.appendChild(c);
}
async function status() {
  try {
    const s = await (await fetch('/status')).json();
    hint.textContent = `Cota local: ${s.usado}/${s.limite} requisições neste mês · cada página gasta 1.`;
  } catch {}
}

const hello = add('bot');
hello.textContent = 'Digite um cargo ou área e eu mostro os requisitos que mais aparecem nas vagas.';
const ex = el('div', 'ex');
['desenvolvedor Kotlin jr', 'QA automation', 'analista de testes pleno'].forEach(t => {
  const b = el('button', null, t);
  b.type = 'button';
  b.onclick = () => { q.value = t; form.requestSubmit(); };
  ex.appendChild(b);
});
hello.appendChild(ex);
hist.forEach(h => { add('user').textContent = h.q; const b = add('bot'); render(b, h.d); extras(b, h.d); });
status();

let ctrl = null;
cancel.onclick = () => ctrl && ctrl.abort();

form.onsubmit = async e => {
  e.preventDefault();
  const texto = q.value.trim();
  if (!texto) return;
  q.value = '';
  add('user').textContent = texto;
  const bot = add('bot');
  const t0 = Date.now();
  bot.textContent = 'Buscando vagas e analisando requisitos…';
  const tick = setInterval(() => {
    bot.textContent = `Buscando vagas e analisando requisitos… ${Math.round((Date.now() - t0) / 1000)}s`;
  }, 1000);
  btn.disabled = true;
  cancel.hidden = false;
  ctrl = new AbortController();
  try {
    const r = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({mensagem: texto, pais: 'br', paginas: +pages.value}),
      signal: ctrl.signal,
    });
    const j = await r.json();
    if (!r.ok) throw new Error(typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail));
    bot.textContent = '';
    render(bot, j.dados);
    extras(bot, j.dados);
    hist.push({q: texto, d: j.dados});
    salvar();
  } catch (err) {
    bot.classList.add('err');
    bot.textContent = err.name === 'AbortError' ? 'Busca cancelada.' : 'Erro: ' + err.message;
  } finally {
    clearInterval(tick);
    btn.disabled = false;
    cancel.hidden = true;
    chat.scrollTop = chat.scrollHeight;
    q.focus();
    status();
  }
};
</script>
</body>
</html>
